[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-team-lab"
version = "0.1.0"
description = "Equipo de agentes expertos reutilizable mediante REST, MCP y CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abel Abbasi" }]
dependencies = [
  "fastapi>=0.115,<1",
  "mcp>=2,<3",
  "openai>=1.99,<3",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
agent-team = "agent_team_lab.cli:main"
agent-team-api = "agent_team_lab.api:main"
agent-team-mcp = "agent_team_lab.mcp_server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

